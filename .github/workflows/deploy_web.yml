name: Deploy Web Demo (GitHub Pages & Netlify)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Web for GitHub Pages
        run: |
          cd example
          flutter pub get
          flutter build web --release --base-href /metadata_audio/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./example/build/web
          publish_branch: gh-pages

      - name: Build Web for Netlify
        if: ${{ secrets.NETLIFY_AUTH_TOKEN != '' }}
        run: |
          cd example
          flutter build web --release --base-href /

      - name: Deploy to Netlify
        if: ${{ secrets.NETLIFY_AUTH_TOKEN != '' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npx --yes netlify-cli deploy --prod --dir=./example/build/web --site=4b261629-1ab8-4db4-b5e4-4915d3ae47c3 --auth="$NETLIFY_AUTH_TOKEN"
